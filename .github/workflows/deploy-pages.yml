name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made with a workflow token do not create another push workflow run.
  # These events guarantee that every committed catalog change reaches Pages.
  workflow_run:
    workflows: ["Index books", "Process private upload queue", "Apply indexed content edit"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce zero-cost public Pages policy
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::Zero-cost mode refuses GitHub-hosted Pages deployment from a private repository."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
