name: Verify project

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-project
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce zero-cost standard-runner policy
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("RUNNER_OS") == "Linux"
          PY
      - name: Install supported SDKs
        run: python -m pip install -r requirements.txt
      - name: Run all tests without indexing or API calls
        run: python -m pytest -q
