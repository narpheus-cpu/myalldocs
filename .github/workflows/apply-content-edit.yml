name: Apply indexed content edit

on:
  workflow_dispatch:
    inputs:
      manifest_id:
        description: "Private Drive queue manifest ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: book-indexer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_QUEUE_MANIFEST_ID: ${{ inputs.manifest_id }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
      APPS_SCRIPT_CALLBACK_URL: ${{ secrets.APPS_SCRIPT_CALLBACK_URL }}
      APPS_SCRIPT_CALLBACK_SECRET: ${{ secrets.APPS_SCRIPT_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install only the Drive reader needed for this edit
        run: python -m pip install "google-api-python-client>=2.150" "google-auth>=2.35"
      - name: Validate the lightweight edit worker
        run: python -m compileall -q indexer/content_edit_worker.py indexer/private_queue.py indexer/queue_context.py
      - name: Apply the private content edit
        run: python -m indexer.content_edit_worker
      - name: Commit the public override only
        shell: bash
        run: |
          git config user.name "book-indexer[bot]"
          git config user.email "book-indexer[bot]@users.noreply.github.com"
          git add data/content-overrides.json data/job-status.json
          if git diff --cached --quiet; then
            echo "No indexed content edit changed."
          else
            git commit -m "chore(content): save indexed book edit"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
